name: Trigger auto deployment for refiapiclass06

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ sprint4-02 ]
    paths:
    - '**'
    - '.github/workflows/refiapiclass06-AutoDeployTrigger-f816d8da-547b-4cd2-8f76-12ffffd80e23.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.REFIAPICLASS06_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.REFIAPICLASS06_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.REFIAPICLASS06_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: registryclass06.azurecr.io
          registryUsername: ${{ secrets.REFIAPICLASS06_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REFIAPICLASS06_REGISTRY_PASSWORD }}
          containerAppName: refiapiclass06
          resourceGroup: grClass06
          imageToBuild: registryclass06.azurecr.io/refiapiclass06:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


